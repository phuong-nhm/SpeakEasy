name: CI frontend
on:
    pull_request:
        branches:
            - main
        paths:
            - 'frontend/**'
jobs:
    lint-and-build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22','24','26']
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                 node-version: ${{ matrix.node-version }}
                 cache: 'npm'
                 cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              # ----------------------------------------------------
      # SECURITY SCAN 1: Quét lỗ hổng thư viện npm chính chủ
      # ----------------------------------------------------
            - name: Audit npm packages
              run: npm audit --audit-level=high
              continue-on-error: true # Đặt true để CI không bị đứng nếu chỉ dính warning nhẹ, giúp bạn vẫn xem được log

            # ----------------------------------------------------
            # SECURITY SCAN 2: Quét mã nguồn & secrets bằng Trivy
            # ----------------------------------------------------
            - name: Run Trivy Security Scan (Frontend)
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: 'fs'
                scan-ref: 'frontend' # Trỏ đúng thư mục chứa code Frontend của bạn
                severity: 'CRITICAL,HIGH'
                exit-code: '0'
            - name: Lint code
              run: npm run lint
            - name: Build project
              run: npm run build
    docker-build-and-push:
        runs-on: ubuntu-latest
        needs: lint-and-build
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ghcr.io/${{ github.repository_owner }}/english-learning-frontend
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                file: Dockerfile # Đường dẫn tới Dockerfile của bạn trong thư mục frontend
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max