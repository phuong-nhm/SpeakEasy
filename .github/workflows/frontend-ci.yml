name: CI frontend
on:
    pull_request:
        branches:
            - main
        paths:
            - 'frontend/**'
    push:
        branches:
            - main
        paths:
            - 'frontend/**'
jobs:
    lint-and-build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: ['22','24','26']
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                 node-version: ${{ matrix.node-version }}
                 cache: 'npm'
                 cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              # ----------------------------------------------------
      # SECURITY SCAN 1: Quét lỗ hổng thư viện npm chính chủ
      # ----------------------------------------------------
            - name: Audit npm packages
              run: npm audit --audit-level=high
              continue-on-error: true # Đặt true để CI không bị đứng nếu chỉ dính warning nhẹ, giúp bạn vẫn xem được log

            # ----------------------------------------------------
            # SECURITY SCAN 2: Quét mã nguồn & secrets bằng Trivy
            # ----------------------------------------------------
            - name: Run Trivy Security Scan (Frontend)
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: 'fs'
                scan-ref: 'frontend' # Trỏ đúng thư mục chứa code Frontend của bạn
                severity: 'CRITICAL,HIGH'
                exit-code: '0'
            - name: Lint code
              run: npm run lint
            - name: Build project
              run: npm run build
    deploy:
        runs-on: ubuntu-latest
        needs: lint-and-build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: production
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Install Vercel CLI
              run: npm install --global vercel@latest
            - name: Pull Vercel Environment Information
              run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
              env:
                VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
            - name: Build Project Artifacts
              run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            - name: Deploy Project Artifacts to Vercel
              run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}