name: CI frontend
on:
    pull_request:
        branches:
            - main
        paths:
            - 'frontend/**'
jobs:
    lint-and-build:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                 node-version: '22'
                 cache: 'npm'
                 cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci
              # ----------------------------------------------------
      # SECURITY SCAN 1: Quét lỗ hổng thư viện npm chính chủ
      # ----------------------------------------------------
            - name: Audit npm packages
              run: npm audit --audit-level=high
              continue-on-error: true # Đặt true để CI không bị đứng nếu chỉ dính warning nhẹ, giúp bạn vẫn xem được log

            # ----------------------------------------------------
            # SECURITY SCAN 2: Quét mã nguồn & secrets bằng Trivy
            # ----------------------------------------------------
            - name: Run Trivy Security Scan (Frontend)
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: 'fs'
                scan-ref: 'frontend' # Trỏ đúng thư mục chứa code Frontend của bạn
                severity: 'CRITICAL,HIGH'
                exit-code: '0'
            - name: Lint code
              run: npm run lint
            - name: Build project
              run: npm run build
