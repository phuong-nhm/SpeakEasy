name: CI AI Agent

on:
  pull_request:
    branches:
      - main
    paths:
      - 'english-agent/**'
  push:
    branches:
      - main
    paths:
      - 'english-agent/**'
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: english-agent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('english-agent/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 safety

      # ----------------------------------------------------
      # SECURITY SCAN 1: Quét lỗ hổng thư viện Python bằng Safety
      # ----------------------------------------------------
      - name: Audit Python packages with Safety
        run: safety check
        continue-on-error: true

      # ----------------------------------------------------
      # SECURITY SCAN 2: Quét mã nguồn & secrets bằng Trivy
      # ----------------------------------------------------
      - name: Run Trivy Security Scan (Agent)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'english-agent'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Lint code with flake8
        run: |
          # Bỏ qua thư mục venv và chỉ quét code chính của agent
          flake8 . --count --select=E9,F63,F7,F82 --exclude=venv,.git,__pycache__ --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --exclude=venv,.git,__pycache__ --statistics
  docker-build-push:
    needs: lint-and-test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/english-learning-agent
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./english-agent
          file: english-agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
