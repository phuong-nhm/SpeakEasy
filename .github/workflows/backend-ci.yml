name: CI Check Backend

on:
  pull_request:
    branches: [ main ]
    paths:
      # Kích hoạt khi có thay đổi trong thư mục code C#, file .sln, NuGet configuration hoặc file CI này
      - 'EnglishLearningApp/**'
      - 'EnglishLearningApp.sln'
      - 'NuGet.Config'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest] # Thay 8.0.x hoặc 9.0.x đúng với bản .NET của bạn
    runs-on: ${{ matrix.os }}

    # KHÔNG CẦN 'defaults.run.working-directory' vì ta sẽ chạy các lệnh dotnet ngay tại root repo nơi chứa file .sln

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Thay 8.0.x hoặc 9.0.x đúng với bản .NET của bạn

      - name: Restore dependencies
        run: dotnet restore EnglishLearningApp.sln
        # ----------------------------------------------------
      # SECURITY SCAN 1: Quét lỗ hổng thư viện NuGet chính chủ .NET
      # ----------------------------------------------------
      - name: Check Vulnerable NuGet Packages
        run: dotnet list EnglishLearningApp.sln package --vulnerable --include-transitive
        # ----------------------------------------------------
      # SECURITY SCAN 2: Quét mã nguồn & cấu hình bằng Trivy
      # ----------------------------------------------------
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'EnglishLearningApp'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Đặt '1' nếu muốn CI bị FAIL ngay khi phát hiện lỗi bảo mật nặng (Critical/High)
# ----------------------------------------------------
      # BƯỚC MỚI 1: Cài đặt công cụ dotnet-ef trên máy ảo CI
      # ----------------------------------------------------
      - name: Install dotnet-ef Tool
        run: dotnet tool install --global dotnet-ef

      # ----------------------------------------------------
      # BƯỚC MỚI 2: Kiểm tra EF Core Migrations (Dry-run)
      # ----------------------------------------------------
      - name: Verify EF Core Migrations
        run: |
          dotnet ef migrations script --idempotent --project EnglishLearningApp/EnglishLearningApp.csproj
       
          
      - name: Build backend project
        run: dotnet build EnglishLearningApp.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test EnglishLearningApp.sln --no-build --configuration Release --verbosity normal